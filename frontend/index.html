<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silent Vision</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app">
    <section class="preview" aria-label="Camera preview">
      <video id="cameraPreview" autoplay playsinline muted></video>
      <canvas id="overlayCanvas"></canvas>
    </section>
    <section class="panel" aria-label="Runtime status">
      <h1>Silent Vision</h1>
      <div class="controls">
        <button id="startButton" type="button">Start</button>
        <button id="stopButton" type="button" disabled>Cancel</button>
      </div>
      <dl id="statusList">
        <dt>Camera</dt><dd id="cameraStatus">idle</dd>
        <dt>WebSocket</dt><dd id="socketStatus">idle</dd>
        <dt>Vision</dt><dd id="visionStatus">waiting</dd>
        <dt>Clip</dt><dd id="bufferStatus">waiting</dd>
        <dt>Command</dt><dd id="lipStatus">waiting</dd>
        <dt>Decision</dt><dd id="semanticStatus">waiting</dd>
        <dt>Agent</dt><dd id="agentStatus">waiting</dd>
      </dl>
      <h2>Candidates</h2>
      <pre id="candidateOutput"></pre>
      <h2>Result</h2>
      <pre id="resultOutput"></pre>
      <section class="calibration" aria-label="Prototype calibration">
        <h2>Calibration</h2>
        <label>
          Intent
          <select id="calibration-intent">
            <option value="LIGHT_ON">LIGHT_ON</option>
            <option value="LIGHT_OFF">LIGHT_OFF</option>
            <option value="OPEN_DOOR">OPEN_DOOR</option>
            <option value="CHAT_OTHER">CHAT_OTHER</option>
            <option value="UNKNOWN">UNKNOWN</option>
          </select>
        </label>
        <label>
          Language
          <select id="calibration-language">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="unknown">Unknown</option>
          </select>
        </label>
        <label>
          Phrase
          <input id="calibration-phrase" placeholder="e.g. 你好，请帮我打开灯">
        </label>
        <button id="save-sample" type="button">Save Sample</button>
        <p id="profile-id"></p>
        <pre id="calibration-result"></pre>
      </section>
    </section>
  </main>
  <script type="module" src="/static/websocket.js"></script>
</body>
</html>
